<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#4F46E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F6FB;
    --surface:#FFFFFF;
    --ink:#16161D;
    --ink-soft:#6E6E82;
    --ink-faint:#A6A6BE;
    --brand:#4F46E5;
    --brand-soft:#EEEDFD;
    --coral:#FF5A6E;
    --coral-soft:#FFE9EC;
    --border:#ECECF3;
    --shadow: 0 1px 2px rgba(22,22,29,.04), 0 4px 16px rgba(22,22,29,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- avatar ---------- */
  .avatar{
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    color:#fff;
    flex-shrink:0;
    text-transform:uppercase;
  }

  /* ---------- topo ---------- */
  header.topo{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(246,246,251,.92);
    backdrop-filter:blur(10px);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .marca{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-pill{
    width:34px;height:34px;
    border-radius:11px;
    overflow:hidden;
    flex-shrink:0;
  }
  .logo-pill img{width:100%;height:100%;object-fit:cover;display:block;}
  .marca h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:19px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .icon-btn{
    width:36px;height:36px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--coral);color:var(--coral);}
  .icon-btn svg{width:17px;height:17px;}

  main{flex:1;padding:4px 0 84px;}
  .secao{display:none;}
  .secao.ativa{display:block;}

  /* ---------- composer ---------- */
  .composer{
    margin:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .composer-topo{
    display:flex;
    gap:11px;
  }
  .composer-topo .avatar{
    width:38px;height:38px;
    font-size:14px;
  }
  .composer textarea{
    flex:1;
    resize:none;
    border:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    line-height:1.4;
    color:var(--ink);
    min-height:44px;
    padding:8px 0 0;
  }
  .composer textarea:focus{outline:none;}
  .composer textarea::placeholder{color:var(--ink-faint);}
  .composer-linha{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    margin-top:6px;
    padding-left:49px;
  }
  .contador{
    font-size:12.5px;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .contador.perto{color:var(--coral);font-weight:600;}
  .btn-postar{
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 20px;
    cursor:pointer;
    transition:opacity .15s;
  }
  .btn-postar:disabled{background:var(--ink-faint);cursor:not-allowed;}
  .btn-postar:not(:disabled):hover{opacity:.88;}

  /* ---------- feed ---------- */
  .post{
    margin:0 16px 12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    display:flex;
    gap:11px;
  }
  .post .avatar{
    width:38px;height:38px;
    font-size:14px;
  }
  .post-corpo{flex:1; min-width:0;}
  .post-topo{
    display:flex;
    align-items:baseline;
    gap:7px;
    margin-bottom:3px;
  }
  .post-autor{
    font-weight:700;
    font-size:14.5px;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .post-hora{
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .post-hora::before{
    content:"·";
    margin-right:7px;
    color:var(--ink-faint);
  }
  .post-texto{
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--ink);
  }
  .post-rodape{
    margin-top:10px;
    display:flex;
    align-items:center;
  }
  .reagir-btn{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-faint);
    padding:5px 10px 5px 6px;
    margin-left:-6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    border-radius:999px;
    transition:background .15s, color .15s;
  }
  .reagir-btn:hover{background:var(--coral-soft); color:var(--coral);}
  .reagir-btn svg{width:17px;height:17px;transition:transform .15s;}
  .reagir-btn.marcado{color:var(--coral);}
  .reagir-btn.marcado svg{fill:var(--coral); stroke:var(--coral); transform:scale(1.08);}
  .reagir-btn:active svg{transform:scale(0.85);}

  .comentar-btn{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-faint);
    padding:5px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    border-radius:999px;
    transition:background .15s, color .15s;
  }
  .comentar-btn:hover{background:var(--brand-soft); color:var(--brand);}
  .comentar-btn.ativo{color:var(--brand);}
  .comentar-btn svg{width:17px;height:17px;}

  .comentarios{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .comentario-item{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .avatar-sm{
    width:26px;height:26px;
    font-size:10.5px;
  }
  .comentario-corpo{
    background:var(--bg);
    border-radius:13px;
    padding:7px 11px;
    flex:1;
    min-width:0;
  }
  .comentario-autor{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    font-size:12.5px;
  }
  .comentario-texto{
    font-size:13.5px;
    line-height:1.4;
    word-break:break-word;
    margin-top:1px;
  }
  .sem-comentarios{
    font-size:13px;
    color:var(--ink-faint);
    padding:4px 0 10px;
  }
  .comentario-form{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .comentario-form input{
    flex:1;
    border:1.5px solid var(--border);
    border-radius:999px;
    padding:9px 14px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    background:var(--bg);
    color:var(--ink);
  }
  .comentario-form input:focus{outline:none; border-color:var(--brand);}
  .comentario-form button{
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:9px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
  }
  .comentario-form button:disabled{background:var(--ink-faint); cursor:not-allowed;}

  .vazio{
    padding:60px 30px;
    text-align:center;
    color:var(--ink-soft);
  }
  .vazio .emoji{font-size:34px; margin-bottom:10px; display:block;}
  .vazio strong{
    display:block;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:16px;
    color:var(--ink);
    margin-bottom:4px;
  }
  .vazio span{font-size:13.5px;}

  /* ---------- convites ---------- */
  .convites-wrap{padding:16px;}
  .convites-intro{
    background:var(--brand-soft);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
  }
  .convites-intro p{
    font-size:13.5px;
    color:#3B3599;
    line-height:1.5;
    margin:0 0 12px;
  }
  .gerar-convite-btn{
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    cursor:pointer;
  }
  .gerar-convite-btn:hover{opacity:.9;}
  .convite-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .convite-codigo{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  .convite-status{
    font-size:11.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
  }
  .convite-status.disponivel{color:#1B8A5A; background:#E4F7EE;}
  .convite-status.usado{color:var(--ink-faint); background:var(--bg);}
  .sem-convites{
    text-align:center;
    color:var(--ink-faint);
    font-size:13.5px;
    padding:30px 10px;
  }

  /* ---------- nav inferior ---------- */
  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 0;
    cursor:pointer;
    color:var(--ink-faint);
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
  }
  nav.tabbar button svg{width:22px;height:22px;}
  nav.tabbar button.ativa{color:var(--brand);}
  nav.tabbar button.ativa svg{fill:var(--brand-soft); stroke:var(--brand);}

  /* ---------- login/cadastro ---------- */
  .tela-auth{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:36px 26px;
  }
  .tela-auth .logo-grande{
    width:72px;height:72px;
    border-radius:20px;
    overflow:hidden;
    margin:0 auto 18px;
  }
  .tela-auth .logo-grande img{width:100%;height:100%;object-fit:cover;display:block;}
  .tela-auth h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:27px;
    text-align:center;
    margin:0 0 6px;
  }
  .tela-auth .tagline{
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 30px;
    line-height:1.5;
  }
  .campo{margin-bottom:13px;}
  .campo label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .campo input{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--border);
    border-radius:13px;
    background:var(--surface);
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .campo input:focus{outline:none;border-color:var(--brand);}
  .btn-principal{
    width:100%;
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:13px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-principal:hover{opacity:.92;}
  .btn-principal:disabled{background:var(--ink-faint);cursor:not-allowed;}
  .troca-modo{
    text-align:center;
    margin-top:20px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .btn-instalar{
    width:100%;
    background:var(--surface);
    color:var(--brand);
    border:1.5px solid var(--brand);
    border-radius:13px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:12px;
    cursor:pointer;
    margin:0 0 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-instalar svg{width:18px;height:18px;}
  .btn-instalar:hover{background:var(--brand-soft);}
  .troca-modo button{
    background:none;
    border:none;
    color:var(--brand);
    font-weight:700;
    cursor:pointer;
    font-size:13.5px;
    padding:0;
  }
  .erro{
    background:var(--coral-soft);
    border:1px solid var(--coral);
    color:#C4293A;
    font-size:13.5px;
    font-weight:500;
    padding:11px 13px;
    border-radius:12px;
    margin-bottom:16px;
  }
  .aviso-config{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:20px;
  }

  /* ---------- perfil ---------- */
  .clicavel{cursor:pointer;}
  .clicavel:hover{text-decoration:underline;}
  .perfil-voltar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:14px 16px 0;
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .perfil-voltar svg{width:16px;height:16px;}
  .perfil-header{
    padding:18px 20px 6px;
    text-align:center;
  }
  .perfil-header .avatar{
    width:78px;height:78px;
    font-size:26px;
    margin:0 auto 12px;
  }
  .perfil-nome{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:20px;
  }
  .perfil-curso{
    display:inline-block;
    margin-top:6px;
    background:var(--brand-soft);
    color:var(--brand);
    font-size:12.5px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
  }
  .perfil-curso.vazio{
    background:var(--bg);
    color:var(--ink-faint);
  }
  .perfil-editar-curso{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:12px;
    padding:0 20px;
  }
  .perfil-editar-curso input{
    flex:1;
    max-width:220px;
    border:1.5px solid var(--border);
    border-radius:999px;
    padding:8px 14px;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .perfil-editar-curso input:focus{outline:none;border-color:var(--brand);}
  .perfil-editar-curso button{
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:8px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .perfil-editar-link{
    display:block;
    margin-top:10px;
    font-size:12.5px;
    color:var(--ink-faint);
    font-weight:600;
    cursor:pointer;
  }
  .perfil-secao-titulo{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    margin:22px 20px 10px;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== aviso caso Firebase não esteja configurado ===== -->
  <div id="aviso-config" class="aviso-config" style="display:none;">
    ⚠ configure o Firebase no início do arquivo HTML (const firebaseConfig) antes de usar.
  </div>

  <!-- ===== tela de login/cadastro ===== -->
  <div id="tela-auth" class="tela-auth" style="display:none;">
    <div class="logo-grande"><img src="icons/icon-512.png" alt="Campus"></div>
    <h1>Campus</h1>
    <p class="tagline">Feed cronológico, sem algoritmo.<br>Só quem tem convite entra.</p>

    <button class="btn-instalar" id="btn-instalar" style="display:none;" onclick="instalarApp()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Baixar app
    </button>

    <div id="erro-auth" class="erro" style="display:none;"></div>

    <form id="form-cadastro" onsubmit="return false;">
      <div class="campo" id="campo-nome">
        <label>Seu nome</label>
        <input type="text" id="input-nome" maxlength="40" placeholder="Como querem te chamar no feed">
      </div>
      <div class="campo" id="campo-curso">
        <label>Curso (opcional)</label>
        <input type="text" id="input-curso" maxlength="60" placeholder="Ex: Biomedicina">
      </div>
      <div class="campo" id="campo-convite">
        <label>Código de convite</label>
        <input type="text" id="input-convite" maxlength="12" placeholder="Ex: A3F9K2" style="text-transform:uppercase;">
      </div>
      <div class="campo">
        <label>Email</label>
        <input type="email" id="input-email" placeholder="voce@email.com">
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="input-senha" placeholder="Mínimo 6 caracteres">
      </div>
      <button class="btn-principal" id="btn-auth" onclick="enviarFormAuth()">Entrar com convite</button>
    </form>

    <div class="troca-modo">
      <span id="texto-troca">Já tem conta? </span>
      <button onclick="alternarModo()" id="btn-troca">Entrar</button>
    </div>
  </div>

  <!-- ===== app logado ===== -->
  <div id="app" style="display:none; flex-direction:column; flex:1;">
    <header class="topo">
      <div class="marca">
        <div class="logo-pill"><img src="icons/icon-192.png" alt="Campus"></div>
        <h1>Campus</h1>
      </div>
      <button class="icon-btn" onclick="sair()" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <main>
      <section id="secao-feed" class="secao ativa">
        <div class="composer">
          <div class="composer-topo">
            <div class="avatar" id="avatar-composer" style="width:38px;height:38px;font-size:14px;"></div>
            <textarea id="texto-post" maxlength="280" placeholder="O que tá rolando por aqui?" oninput="atualizarContador()"></textarea>
          </div>
          <div class="composer-linha">
            <span class="contador" id="contador-chars">280</span>
            <button class="btn-postar" id="btn-postar" onclick="publicarPost()" disabled>Postar</button>
          </div>
        </div>
        <div id="lista-posts"></div>
      </section>

      <section id="secao-convites" class="secao">
        <div class="convites-wrap">
          <div class="convites-intro">
            <p>Cada convite libera uma nova pessoa na rede. Gere um código e compartilhe com quem você confia.</p>
            <button class="gerar-convite-btn" onclick="gerarConvite()">+ Gerar convite</button>
          </div>
          <div id="lista-convites"></div>
        </div>
      </section>

      <section id="secao-perfil" class="secao">
        <div id="perfil-conteudo"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab-btn ativa" data-aba="feed" onclick="trocarAba('feed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Feed
      </button>

/* =====================================================================
   3) AVATAR (cor gerada a partir do nome)
===================================================================== */
const CORES_AVATAR = ['#4F46E5','#FF5A6E','#0EA5A4','#F59E0B','#EC4899','#22C55E','#8B5CF6','#EF4444'];

function corAvatar(nome){
  let hash = 0;
  for(let i=0;i<nome.length;i++){ hash = nome.charCodeAt(i) + ((hash << 5) - hash); }
  return CORES_AVATAR[Math.abs(hash) % CORES_AVATAR.length];
}

function iniciais(nome){
  if(!nome) return '?';
  const partes = nome.trim().split(/\s+/);
  if(partes.length === 1) return partes[0].slice(0,2);
  return partes[0][0] + partes[partes.length-1][0];
}

function montarAvatar(nome){
  const div = document.createElement('div');
  div.className = 'avatar';
  div.style.background = corAvatar(nome || '?');
  div.textContent = iniciais(nome);
  return div;
}

function montarAvatarHtml(nome, classeExtra){
  return `<div class="avatar ${classeExtra||''}" style="background:${corAvatar(nome||'?')}">${iniciais(nome)}</div>`;
}

   4) AUTENTICAÇÃO
===================================================================== */
function alternarModo(){
  modoCadastro = !modoCadastro;
  document.getElementById('campo-nome').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('campo-curso').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('campo-convite').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('btn-auth').textContent = modoCadastro ? 'Entrar com convite' : 'Entrar';
  document.getElementById('texto-troca').textContent = modoCadastro ? 'Já tem conta? ' : 'Não tem conta? ';
  document.getElementById('btn-troca').textContent = modoCadastro ? 'Entrar' : 'Cadastrar';
  esconderErro();
}

function mostrarErro(msg){
  const el = document.getElementById('erro-auth');
  el.textContent = msg;
  el.style.display = 'block';
}
function esconderErro(){
  document.getElementById('erro-auth').style.display = 'none';
}

async function enviarFormAuth(){
  esconderErro();
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  const btn = document.getElementById('btn-auth');

  if(!email || !senha){ mostrarErro('Preencha email e senha.'); return; }

  btn.disabled = true;

  try{
    if(modoCadastro){
      const nome = document.getElementById('input-nome').value.trim();
      const curso = document.getElementById('input-curso').value.trim();
      const codigo = document.getElementById('input-convite').value.trim().toUpperCase();
      if(!nome){ mostrarErro('Diz seu nome pra gente te mostrar no feed.'); btn.disabled=false; return; }
      if(!codigo){ mostrarErro('Precisa de um código de convite pra entrar.'); btn.disabled=false; return; }

      const conviteRef = db.collection('invites').doc(codigo);
      const conviteSnap = await conviteRef.get();
      if(!conviteSnap.exists){ mostrarErro('Esse código de convite não existe.'); btn.disabled=false; return; }
      if(conviteSnap.data().used){ mostrarErro('Esse código já foi usado.'); btn.disabled=false; return; }

      const cred = await auth.createUserWithEmailAndPassword(email, senha);
      const uid = cred.user.uid;

      await db.collection('users').doc(uid).set({
        nome: nome,
        curso: curso || '',
        entrouEm: firebase.firestore.FieldValue.serverTimestamp(),
        convidadoPor: conviteSnap.data().criadoPorNome || null
      });

      await conviteRef.update({
        used: true,
        usadoPor: uid,
        usadoPorNome: nome,
        criadoPor: conviteSnap.data().criadoPor,
        criadoPorNome: conviteSnap.data().criadoPorNome,
        usadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

    }else{
      await auth.signInWithEmailAndPassword(email, senha);
    }
  }catch(e){
    mostrarErro(traduzErro(e.code));
  }
  btn.disabled = false;
}

function traduzErro(code){
  const mapa = {
    'auth/email-already-in-use': 'Esse email já tem conta.',
    'auth/invalid-email': 'Email inválido.',
    'auth/weak-password': 'Senha muito curta (mínimo 6 caracteres).',
    'auth/user-not-found': 'Não achamos conta com esse email.',
    'auth/wrong-password': 'Senha errada.',
    'auth/invalid-credential': 'Email ou senha errados.'
  };
  return mapa[code] || 'Algo deu errado. Tenta de novo.';
}

}

   7) FEED

function atualizarContador(){
  const texto = document.getElementById('texto-post').value;
  const restante = 280 - texto.length;

  contador.textContent = restante;

function renderizarFeed(snapshot){
  ultimoSnapshotPosts = snapshot;

  snapshot.forEach(doc=>{

function criarElementoPost(doc, origem){
  const p = doc.data();
  const reacoes = p.reacoes || {};
  const total = Object.keys(reacoes).length;
  const euReagi = usuarioAtual && reacoes[usuarioAtual.uid];
  const totalComentarios = p.totalComentarios || 0;

  const post = document.createElement('div');
  post.className = 'post';

  const avatar = montarAvatar(p.autorNome);

  avatar.onclick = () => abrirPerfil(p.autorUid);

  const corpo = document.createElement('div');
  corpo.className = 'post-corpo';

    <div class="post-topo">
      <span class="post-autor clicavel" onclick="abrirPerfil('${p.autorUid}')">${escapeHtml(p.autorNome || 'alguém')}</span>

    <div class="post-texto">${escapeHtml(p.texto)}</div>
    <div class="post-rodape">
      <button class="reagir-btn ${euReagi ? 'marcado' : ''}" onclick="reagir('${doc.id}', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="contagem">${total > 0 ? total : ''}</span>
      </button>
      <button class="comentar-btn" id="comentar-btn-${origem}-${doc.id}" onclick="toggleComentarios('${doc.id}','${origem}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span class="contagem">${totalComentarios > 0 ? totalComentarios : ''}</span>
      </button>
    </div>
    <div id="painel-comentarios-${origem}-${doc.id}"></div>
  `;
  post.appendChild(corpo);
  return post;
}

/* =====================================================================
   9) COMENTÁRIOS
===================================================================== */
async function toggleComentarios(postId, origem){
  const chave = postId + '|' + origem;
  const btn = document.getElementById(`comentar-btn-${origem}-${postId}`);
  const painel = document.getElementById(`painel-comentarios-${origem}-${postId}`);
  const abrindo = !comentariosAbertos[chave];
  comentariosAbertos[chave] = abrindo;
  if(btn) btn.classList.toggle('ativo', abrindo);

  if(!abrindo){
    if(painel) painel.innerHTML = '';
    return;
  }

  if(!comentariosCache[postId]){
    if(painel) painel.innerHTML = '<div class="sem-comentarios">Carregando...</div>';
    comentariosCache[postId] = await buscarComentarios(postId);
  }
  renderizarPainelComentarios(postId, origem);
}

async function buscarComentarios(postId){
  const snap = await db.collection('posts').doc(postId)
    .collection('comentarios')
    .orderBy('criadoEm','asc')
    .limit(200)
    .get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function renderizarPainelComentarios(postId, origem){
  const painel = document.getElementById(`painel-comentarios-${origem}-${postId}`);
  if(!painel) return;
  const comentarios = comentariosCache[postId] || [];

  const listaHtml = comentarios.length === 0
    ? '<div class="sem-comentarios">Ainda sem respostas. Seja a primeira pessoa a comentar.</div>'
    : comentarios.map(c => `
        <div class="comentario-item">
          <div class="avatar avatar-sm clicavel" style="background:${corAvatar(c.autorNome||'?')}" onclick="abrirPerfil('${c.autorUid}')">${iniciais(c.autorNome)}</div>
          <div class="comentario-corpo">
            <div class="comentario-autor clicavel" onclick="abrirPerfil('${c.autorUid}')">${escapeHtml(c.autorNome || 'alguém')}</div>
            <div class="comentario-texto">${escapeHtml(c.texto)}</div>
          </div>
        </div>
      `).join('');

  painel.innerHTML = `
    <div class="comentarios">
      ${listaHtml}
      <div class="comentario-form">
        <input type="text" id="input-comentario-${origem}-${postId}" maxlength="280" placeholder="Escreva uma resposta..."
          onkeydown="if(event.key==='Enter'){enviarComentario('${postId}','${origem}')}">
        <button onclick="enviarComentario('${postId}','${origem}')">Enviar</button>
      </div>
    </div>
  `;
}

async function enviarComentario(postId, origem){
  const input = document.getElementById(`input-comentario-${origem}-${postId}`);
  if(!input) return;
  const texto = input.value.trim();
  if(!texto) return;

  input.disabled = true;

  const dados = {
    texto: texto,
    autorUid: usuarioAtual.uid,
    autorNome: usuarioAtual.nome,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  };

  const ref = await db.collection('posts').doc(postId).collection('comentarios').add(dados);

  await db.collection('posts').doc(postId).update({
    totalComentarios: firebase.firestore.FieldValue.increment(1)
  });

  if(!comentariosCache[postId]) comentariosCache[postId] = [];
  comentariosCache[postId].push({ id: ref.id, ...dados, criadoEm: null });

  // atualiza o contador visível de comentários em qualquer lugar que esteja na tela
  document.querySelectorAll(`[id^="comentar-btn-"][id$="-${postId}"]`).forEach(btn=>{
    const span = btn.querySelector('.contagem');
    span.textContent = comentariosCache[postId].length;
  });

  input.value = '';
  input.disabled = false;
  renderizarPainelComentarios(postId, origem);
  document.getElementById(`input-comentario-${origem}-${postId}`).focus();
}

async function abrirPerfil(uid){
  if(!uid) return;
  const abaAtiva = document.querySelector('.tab-btn.ativa')?.dataset.aba;
  if(abaAtiva && abaAtiva !== 'perfil'){ abaAntesDoPerfil = abaAtiva; }

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('ativa', b.dataset.aba==='perfil'));
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('secao-perfil').classList.add('ativa');

  const container = document.getElementById('perfil-conteudo');
  container.innerHTML = '<div class="vazio">Carregando perfil...</div>';

  const [docUsuario, snapPosts] = await Promise.all([
    db.collection('users').doc(uid).get(),
    db.collection('posts').where('autorUid','==',uid).orderBy('criadoEm','desc').limit(200).get()
  ]);

  const dados = docUsuario.exists ? docUsuario.data() : { nome: 'alguém', curso: '' };
  const ehEuMesmo = usuarioAtual && uid === usuarioAtual.uid;

  container.innerHTML = `
    <div class="perfil-voltar" onclick="trocarAba(abaAntesDoPerfil)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar
    </div>
    <div class="perfil-header">
      ${montarAvatarHtml(dados.nome)}
      <div class="perfil-nome">${escapeHtml(dados.nome || 'alguém')}</div>
      ${dados.curso
        ? `<span class="perfil-curso">${escapeHtml(dados.curso)}</span>`
        : `<span class="perfil-curso vazio">Curso não informado</span>`}
      ${ehEuMesmo ? `<span class="perfil-editar-link" onclick="mostrarEdicaoCurso()">editar curso</span>` : ''}
      <div class="perfil-editar-curso" id="perfil-editar-curso" style="display:none;">
        <input type="text" id="input-editar-curso" maxlength="60" placeholder="Ex: Biomedicina" value="${escapeHtml(dados.curso||'')}">
        <button onclick="salvarCurso('${uid}')">Salvar</button>
      </div>
    </div>
    <div class="perfil-secao-titulo">Posts</div>
    <div id="lista-posts-perfil"></div>
  `;

  const listaPerfil = document.getElementById('lista-posts-perfil');
  if(snapPosts.empty){
    listaPerfil.innerHTML = `
      <div class="vazio">
        <span class="emoji">📝</span>
        <strong>Nenhum post ainda</strong>
        <span>${ehEuMesmo ? 'Você ainda não postou nada.' : 'Essa pessoa ainda não postou nada.'}</span>
      </div>`;
    return;
  }
  snapPosts.forEach(doc=>{
    listaPerfil.appendChild(criarElementoPost(doc, 'perfil'));
    const chave = doc.id + '|perfil';
    if(comentariosAbertos[chave]){
      renderizarPainelComentarios(doc.id, 'perfil');
    }
  });
}

function mostrarEdicaoCurso(){
  document.getElementById('perfil-editar-curso').style.display = 'flex';
}

async function salvarCurso(uid){
  const input = document.getElementById('input-editar-curso');
  const novoCurso = input.value.trim();
  await db.collection('users').doc(uid).update({ curso: novoCurso });
  abrirPerfil(uid);
}

async function reagir(postId, btn){
  if(!usuarioAtual) return;
  const jaMarcado = btn.classList.contains('marcado');
  const span = btn.querySelector('.contagem');
  let n = parseInt(span.textContent) || 0;
  n = jaMarcado ? Math.max(0, n-1) : n+1;
  span.textContent = n > 0 ? n : '';
  btn.classList.toggle('marcado', !jaMarcado);

  const ref = db.collection('posts').doc(postId);
  await db.runTransaction(async (t)=>{
    const snap = await t.get(ref);
    if(!snap.exists) return;
    const reacoes = snap.data().reacoes || {};
    if(reacoes[usuarioAtual.uid]){
      delete reacoes[usuarioAtual.uid];
    }else{
      reacoes[usuarioAtual.uid] = true;
    }
    t.update(ref, { reacoes: reacoes });
  });
}

function formatarHora(timestamp){
  if(!timestamp) return 'agora';
  const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const agora = new Date();
  const diffMs = agora - data;
  const diffMin = Math.floor(diffMs / 60000);
  if(diffMin < 1) return 'agora';
  if(diffMin < 60) return diffMin + 'min';
  const diffH = Math.floor(diffMin / 60);
  if(diffH < 24) return diffH + 'h';
  const diffD = Math.floor(diffH / 24);
  if(diffD === 1) return 'ontem';
  if(diffD < 7) return diffD + 'd';
  return data.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* =====================================================================
   8) CONVITES
===================================================================== */
function gerarCodigo(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let codigo = '';
  for(let i=0;i<6;i++){
    codigo += chars[Math.floor(Math.random()*chars.length)];
  }
  return codigo;
}

async function gerarConvite(){
  let codigo = gerarCodigo();
  let existe = await db.collection('invites').doc(codigo).get();
  while(existe.exists){
    codigo = gerarCodigo();
    existe = await db.collection('invites').doc(codigo).get();
  }

  await db.collection('invites').doc(codigo).set({
    used: false,
    criadoPor: usuarioAtual.uid,
    criadoPorNome: usuarioAtual.nome,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  carregarConvites();
}

async function carregarConvites(){
  if(!usuarioAtual) return;
  const snap = await db.collection('invites')
    .where('criadoPor','==',usuarioAtual.uid)
    .orderBy('criadoEm','desc')
    .get();

  const lista = document.getElementById('lista-convites');
  if(snap.empty){
    lista.innerHTML = '<p class="sem-convites">Você ainda não gerou nenhum convite.</p>';
    return;
  }
  lista.innerHTML = '';
  snap.forEach(doc=>{
    const c = doc.data();
    const div = document.createElement('div');
    div.className = 'convite-item';
    div.innerHTML = `
      <span class="convite-codigo">${doc.id}</span>
      <span class="convite-status ${c.used ? 'usado' : 'disponivel'}">
        ${c.used ? ('usado por ' + escapeHtml(c.usadoPorNome || '?')) : 'disponível'}
      </span>
    `;
    lista.appendChild(div);
  });
}
</script>
</body>
</html>
