<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus — microblog local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;900&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-raised:#F5F0E4;
    --ink:#241F1A;
    --ink-soft:#5A5142;
    --stamp:#A6342C;
    --sage:#4F6B4A;
    --line:#C9BFA8;
    --line-strong:#8A7F6E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }

  /* ---------- topo ---------- */
  header.topo{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line-strong);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .marca{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .selo{
    width:38px;height:38px;
    border:2px solid var(--stamp);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:13px;
    color:var(--stamp);
    transform:rotate(-8deg);
    flex-shrink:0;
  }
  .marca h1{
    font-family:'Bitter',serif;
    font-weight:900;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .marca .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .sair-btn{
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    font-family:'Work Sans',sans-serif;
    font-size:13px;
    padding:7px 12px;
    cursor:pointer;
  }
  .sair-btn:hover{border-color:var(--stamp);color:var(--stamp);}

  /* ---------- abas ---------- */
  nav.abas{
    display:flex;
    border-bottom:1px solid var(--line-strong);
  }
  nav.abas button{
    flex:1;
    background:none;
    border:none;
    padding:13px 8px;
    font-family:'Work Sans',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    margin-bottom:-1px;
  }
  nav.abas button.ativa{
    color:var(--ink);
    border-bottom-color:var(--stamp);
  }

  main{flex:1;padding:0 0 60px;}
  .secao{display:none;}
  .secao.ativa{display:block;}

  /* ---------- composer ---------- */
  .composer{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  .composer textarea{
    width:100%;
    resize:none;
    border:none;
    background:transparent;
    font-family:'Work Sans',sans-serif;
    font-size:16px;
    line-height:1.45;
    color:var(--ink);
    min-height:60px;
    padding:0;
  }
  .composer textarea:focus{outline:none;}
  .composer textarea::placeholder{color:#A69C8A;}
  .composer-linha{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
  }
  .contador{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .contador.perto{color:var(--stamp);}
  .btn-postar{
    background:var(--stamp);
    color:var(--paper-raised);
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    cursor:pointer;
  }
  .btn-postar:disabled{background:var(--line-strong);cursor:not-allowed;}

  /* ---------- feed ---------- */
  .post{
    padding:16px 20px;
    border-bottom:1px dashed var(--line);
  }
  .post-topo{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .post-autor{
    font-weight:600;
    font-size:14.5px;
  }
  .post-hora{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .post-texto{
    font-size:15.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .post-rodape{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .reagir-btn{
    background:none;
    border:1px solid var(--line);
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    padding:4px 9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .reagir-btn.marcado{
    border-color:var(--sage);
    color:var(--sage);
  }
  .vazio{
    padding:50px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'Bitter',serif;
    font-size:16px;
    line-height:1.6;
  }

  /* ---------- convites ---------- */
  .convites-wrap{padding:18px 20px;}
  .convites-wrap p.explica{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin-top:0;
  }
  .gerar-convite-btn{
    background:var(--ink);
    color:var(--paper-raised);
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 16px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .convite-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-family:'Space Mono',monospace;
  }
  .convite-codigo{
    font-size:16px;
    font-weight:700;
    letter-spacing:0.05em;
  }
  .convite-status{
    font-size:11px;
    padding:3px 8px;
    border:1px solid var(--line-strong);
  }
  .convite-status.disponivel{color:var(--sage);border-color:var(--sage);}
  .convite-status.usado{color:var(--ink-soft);}

  /* ---------- login/cadastro ---------- */
  .tela-auth{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:40px 28px;
  }
  .tela-auth .selo-grande{
    width:64px;height:64px;
    border:2.5px solid var(--stamp);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:20px;
    color:var(--stamp);
    transform:rotate(-8deg);
    margin:0 auto 18px;
  }
  .tela-auth h1{
    font-family:'Bitter',serif;
    font-weight:900;
    font-size:30px;
    text-align:center;
    margin:0 0 6px;
  }
  .tela-auth .tagline{
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 32px;
    line-height:1.5;
  }
  .campo{margin-bottom:14px;}
  .campo label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:5px;
    text-transform:lowercase;
  }
  .campo input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .campo input:focus{outline:none;border-color:var(--stamp);}
  .btn-principal{
    width:100%;
    background:var(--stamp);
    color:var(--paper-raised);
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-principal:disabled{background:var(--line-strong);cursor:not-allowed;}
  .troca-modo{
    text-align:center;
    margin-top:18px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .troca-modo button{
    background:none;
    border:none;
    color:var(--stamp);
    font-weight:600;
    cursor:pointer;
    font-size:13.5px;
    padding:0;
    text-decoration:underline;
  }
  .erro{
    background:#F2DEDA;
    border:1px solid var(--stamp);
    color:var(--stamp);
    font-size:13.5px;
    padding:10px 12px;
    margin-bottom:14px;
  }
  .aviso-config{
    background:var(--paper-raised);
    border:1px solid var(--line-strong);
    padding:16px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:20px;
    font-family:'Space Mono',monospace;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== aviso caso Firebase não esteja configurado ===== -->
  <div id="aviso-config" class="aviso-config" style="display:none;">
    ⚠ configure o Firebase no início do arquivo HTML (const firebaseConfig) antes de usar.
  </div>

  <!-- ===== tela de login/cadastro ===== -->
  <div id="tela-auth" class="tela-auth" style="display:none;">
    <div class="selo-grande">CP</div>
    <h1>Campus</h1>
    <p class="tagline">Feed cronológico, sem algoritmo.<br>Só quem tem convite entra.</p>

    <div id="erro-auth" class="erro" style="display:none;"></div>

    <form id="form-cadastro" onsubmit="return false;">
      <div class="campo" id="campo-nome">
        <label>seu nome</label>
        <input type="text" id="input-nome" maxlength="40" placeholder="como querem te chamar no feed">
      </div>
      <div class="campo" id="campo-convite">
        <label>código de convite</label>
        <input type="text" id="input-convite" maxlength="12" placeholder="ex: A3F9K2" style="text-transform:uppercase;">
      </div>
      <div class="campo">
        <label>email</label>
        <input type="email" id="input-email" placeholder="voce@email.com">
      </div>
      <div class="campo">
        <label>senha</label>
        <input type="password" id="input-senha" placeholder="mínimo 6 caracteres">
      </div>
      <button class="btn-principal" id="btn-auth" onclick="enviarFormAuth()">Entrar com convite</button>
    </form>

    <div class="troca-modo">
      <span id="texto-troca">Já tem conta? </span>
      <button onclick="alternarModo()" id="btn-troca">Entrar</button>
    </div>
  </div>

  <!-- ===== app logado ===== -->
  <div id="app" style="display:none; flex:1; display:none; flex-direction:column;">
    <header class="topo">
      <div class="marca">
        <div class="selo">CP</div>
        <div>
          <h1>Campus</h1>
          <div class="sub" id="ola-usuario"></div>
        </div>
      </div>
      <button class="sair-btn" onclick="sair()">sair</button>
    </header>

    <nav class="abas">
      <button class="aba-btn ativa" data-aba="feed" onclick="trocarAba('feed')">Feed</button>
      <button class="aba-btn" data-aba="convites" onclick="trocarAba('convites')">Convites</button>
    </nav>

    <main>
      <section id="secao-feed" class="secao ativa">
        <div class="composer">
          <textarea id="texto-post" maxlength="280" placeholder="o que tá rolando por aqui?" oninput="atualizarContador()"></textarea>
          <div class="composer-linha">
            <span class="contador" id="contador-chars">280</span>
            <button class="btn-postar" id="btn-postar" onclick="publicarPost()" disabled>Postar</button>
          </div>
        </div>
        <div id="lista-posts"></div>
      </section>

      <section id="secao-convites" class="secao">
        <div class="convites-wrap">
          <p class="explica">Cada convite libera uma nova pessoa na rede. Gere um código e compartilhe com quem você confia.</p>
          <button class="gerar-convite-btn" onclick="gerarConvite()">+ Gerar convite</button>
          <div id="lista-convites"></div>
        </div>
      </section>
    </main>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   1) CONFIGURAÇÃO DO FIREBASE
   Troque os valores abaixo pelos do SEU projeto Firebase.
   Veja o passo a passo que a Claude te mandou junto com este arquivo.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDqFHaA4NG8Qpv7Rq2vqVW7F4bfux7AyW0",
  authDomain: "campus-64aa0.firebaseapp.com",
  projectId: "campus-64aa0",
  storageBucket: "campus-64aa0.firebasestorage.app",
  messagingSenderId: "676459356565",
  appId: "1:676459356565:web:199372c589fe6805d2969c"
};

let app, auth, db;
let configOk = firebaseConfig.apiKey !== "COLE_AQUI";

if(configOk){
  app = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}else{
  document.getElementById('aviso-config').style.display = 'block';
}

/* =====================================================================
   2) ESTADO
===================================================================== */
let modoCadastro = true;
let unsubscribeFeed = null;
let usuarioAtual = null; // {uid, nome}

/* =====================================================================
   3) AUTENTICAÇÃO
===================================================================== */
function alternarModo(){
  modoCadastro = !modoCadastro;
  document.getElementById('campo-nome').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('campo-convite').style.display = modoCadastro ? 'block' : 'none';
  document.getElementById('btn-auth').textContent = modoCadastro ? 'Entrar com convite' : 'Entrar';
  document.getElementById('texto-troca').textContent = modoCadastro ? 'Já tem conta? ' : 'Não tem conta? ';
  document.getElementById('btn-troca').textContent = modoCadastro ? 'Entrar' : 'Cadastrar';
  esconderErro();
}

function mostrarErro(msg){
  const el = document.getElementById('erro-auth');
  el.textContent = msg;
  el.style.display = 'block';
}
function esconderErro(){
  document.getElementById('erro-auth').style.display = 'none';
}

async function enviarFormAuth(){
  esconderErro();
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  const btn = document.getElementById('btn-auth');

  if(!email || !senha){ mostrarErro('Preencha email e senha.'); return; }

  btn.disabled = true;

  try{
    if(modoCadastro){
      const nome = document.getElementById('input-nome').value.trim();
      const codigo = document.getElementById('input-convite').value.trim().toUpperCase();
      if(!nome){ mostrarErro('Diz seu nome pra gente te mostrar no feed.'); btn.disabled=false; return; }
      if(!codigo){ mostrarErro('Precisa de um código de convite pra entrar.'); btn.disabled=false; return; }

      const conviteRef = db.collection('invites').doc(codigo);
      const conviteSnap = await conviteRef.get();
      if(!conviteSnap.exists){ mostrarErro('Esse código de convite não existe.'); btn.disabled=false; return; }
      if(conviteSnap.data().used){ mostrarErro('Esse código já foi usado.'); btn.disabled=false; return; }

      const cred = await auth.createUserWithEmailAndPassword(email, senha);
      const uid = cred.user.uid;

      await db.collection('users').doc(uid).set({
        nome: nome,
        entrouEm: firebase.firestore.FieldValue.serverTimestamp(),
        convidadoPor: conviteSnap.data().criadoPorNome || null
      });

      await conviteRef.update({
        used: true,
        usadoPor: uid,
        usadoPorNome: nome,
        usadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

    }else{
      await auth.signInWithEmailAndPassword(email, senha);
    }
  }catch(e){
    mostrarErro(traduzErro(e.code));
  }
  btn.disabled = false;
}

function traduzErro(code){
  const mapa = {
    'auth/email-already-in-use': 'Esse email já tem conta.',
    'auth/invalid-email': 'Email inválido.',
    'auth/weak-password': 'Senha muito curta (mínimo 6 caracteres).',
    'auth/user-not-found': 'Não achamos conta com esse email.',
    'auth/wrong-password': 'Senha errada.',
    'auth/invalid-credential': 'Email ou senha errados.'
  };
  return mapa[code] || 'Algo deu errado. Tenta de novo.';
}

function sair(){
  if(unsubscribeFeed) unsubscribeFeed();
  auth.signOut();
}

/* =====================================================================
   4) TROCA DE TELA CONFORME LOGIN
===================================================================== */
if(configOk){
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      const doc = await db.collection('users').doc(user.uid).get();
      const nome = doc.exists ? doc.data().nome : 'você';
      usuarioAtual = { uid: user.uid, nome: nome };

      document.getElementById('tela-auth').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('ola-usuario').textContent = 'logado como ' + nome;

      iniciarFeed();
      carregarConvites();
    }else{
      usuarioAtual = null;
      if(unsubscribeFeed) unsubscribeFeed();
      document.getElementById('app').style.display = 'none';
      document.getElementById('tela-auth').style.display = 'flex';
    }
  });
}

/* =====================================================================
   5) ABAS
===================================================================== */
function trocarAba(nome){
  document.querySelectorAll('.aba-btn').forEach(b=>b.classList.toggle('ativa', b.dataset.aba===nome));
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('secao-'+nome).classList.add('ativa');
}

/* =====================================================================
   6) FEED
===================================================================== */
function atualizarContador(){
  const texto = document.getElementById('texto-post').value;
  const restante = 280 - texto.length;
  const contador = document.getElementById('contador-chars');
  contador.textContent = restante;
  contador.classList.toggle('perto', restante <= 20);
  document.getElementById('btn-postar').disabled = texto.trim().length === 0;
}

async function publicarPost(){
  const textarea = document.getElementById('texto-post');
  const texto = textarea.value.trim();
  if(!texto) return;
  const btn = document.getElementById('btn-postar');
  btn.disabled = true;

  await db.collection('posts').add({
    texto: texto,
    autorUid: usuarioAtual.uid,
    autorNome: usuarioAtual.nome,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    reacoes: {}
  });

  textarea.value = '';
  atualizarContador();
}

function iniciarFeed(){
  if(unsubscribeFeed) unsubscribeFeed();
  unsubscribeFeed = db.collection('posts')
    .orderBy('criadoEm','desc')
    .limit(200)
    .onSnapshot(renderizarFeed, (err)=>{
      console.error(err);
    });
}

function renderizarFeed(snapshot){
  const lista = document.getElementById('lista-posts');
  if(snapshot.empty){
    lista.innerHTML = '<div class="vazio">Ninguém postou nada ainda.<br>Seja a primeira pessoa a quebrar o silêncio.</div>';
    return;
  }
  lista.innerHTML = '';
  snapshot.forEach(doc=>{
    const p = doc.data();
    const reacoes = p.reacoes || {};
    const total = Object.keys(reacoes).length;
    const euReagi = usuarioAtual && reacoes[usuarioAtual.uid];

    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
      <div class="post-topo">
        <span class="post-autor">${escapeHtml(p.autorNome || 'alguém')}</span>
        <span class="post-hora">${formatarHora(p.criadoEm)}</span>
      </div>
      <div class="post-texto">${escapeHtml(p.texto)}</div>
      <div class="post-rodape">
        <button class="reagir-btn ${euReagi ? 'marcado' : ''}" onclick="reagir('${doc.id}')">
          ✋ ${total > 0 ? total : ''}
        </button>
      </div>
    `;
    lista.appendChild(div);
  });
}

async function reagir(postId){
  if(!usuarioAtual) return;
  const ref = db.collection('posts').doc(postId);
  await db.runTransaction(async (t)=>{
    const snap = await t.get(ref);
    if(!snap.exists) return;
    const reacoes = snap.data().reacoes || {};
    if(reacoes[usuarioAtual.uid]){
      delete reacoes[usuarioAtual.uid];
    }else{
      reacoes[usuarioAtual.uid] = true;
    }
    t.update(ref, { reacoes: reacoes });
  });
}

function formatarHora(timestamp){
  if(!timestamp) return 'agora';
  const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const agora = new Date();
  const diffMs = agora - data;
  const diffMin = Math.floor(diffMs / 60000);
  if(diffMin < 1) return 'agora';
  if(diffMin < 60) return 'há ' + diffMin + ' min';
  const diffH = Math.floor(diffMin / 60);
  if(diffH < 24) return 'há ' + diffH + ' h';
  const diffD = Math.floor(diffH / 24);
  if(diffD === 1) return 'ontem';
  if(diffD < 7) return 'há ' + diffD + ' dias';
  return data.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* =====================================================================
   7) CONVITES
===================================================================== */
function gerarCodigo(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sem letras/números ambíguos
  let codigo = '';
  for(let i=0;i<6;i++){
    codigo += chars[Math.floor(Math.random()*chars.length)];
  }
  return codigo;
}

async function gerarConvite(){
  let codigo = gerarCodigo();
  // garante que não colide com um existente
  let existe = await db.collection('invites').doc(codigo).get();
  while(existe.exists){
    codigo = gerarCodigo();
    existe = await db.collection('invites').doc(codigo).get();
  }

  await db.collection('invites').doc(codigo).set({
    used: false,
    criadoPor: usuarioAtual.uid,
    criadoPorNome: usuarioAtual.nome,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  carregarConvites();
}

async function carregarConvites(){
  if(!usuarioAtual) return;
  const snap = await db.collection('invites')
    .where('criadoPor','==',usuarioAtual.uid)
    .orderBy('criadoEm','desc')
    .get();

  const lista = document.getElementById('lista-convites');
  if(snap.empty){
    lista.innerHTML = '<p style="color:var(--ink-soft); font-size:13.5px;">Você ainda não gerou nenhum convite.</p>';
    return;
  }
  lista.innerHTML = '';
  snap.forEach(doc=>{
    const c = doc.data();
    const div = document.createElement('div');
    div.className = 'convite-item';
    div.innerHTML = `
      <span class="convite-codigo">${doc.id}</span>
      <span class="convite-status ${c.used ? 'usado' : 'disponivel'}">
        ${c.used ? ('usado por ' + escapeHtml(c.usadoPorNome || '?')) : 'disponível'}
      </span>
    `;
    lista.appendChild(div);
  });
}
</script>
